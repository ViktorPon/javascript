<html>  
<head>  
<title> 
Przykład obliczenia P i obwodu prostokąta 
</title> 
<script language="JavaScript"> 
function drabina_ponomarenko(d,x)
{
    d_liczba=parseFloat(d)
    x_liczba=parseFloat(x)
    drabina=Math.sqrt(d_liczba*d_liczba+x_liczba*x_liczba);
    document.getElementsByName('drabina')[0].value=drabina.toFixed(2);   /* na dokument  */
    pokaz1.innerHTML="drabina="+drabina.toFixed(2)+" cm"+"<br>"; 
}
function alfa_pon(d,drabina)
{
    d_liczba=parseFloat(d)
    drabina_liczba=parseFloat(drabina)
    alfa=Math.asin(d_liczba/drabina_liczba)*180/Math.PI;
    document.getElementsByName('alfa')[0].value=alfa.toFixed(2);   /* na dokument  */
    pokaz2.innerHTML="alfa="+alfa.toFixed(2)+" stopni"+"<br>"; 
}
       </script> 
       <style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        font-style: italic;
        font-size: 15px;
        }
    input{
        padding-left:5%;
        
    }
    #pokaz1{
        font-family: monospace;
        font-size:26px;
         animation-name: test;
        animation-duration: 4s;
    }
     #pokaz2{
        font-family: monospace;
        font-size:26px;
        animation-name: test;
        animation-duration: 8s;
    }
    @keyframes test {
  0%   {color: red;font-size: 12px;}
  25%  {color: yellow;font-size: 15x;}
  50%  {color: blue;font-size: 18px;}
  100% {color: green;font-size: 21px;}
}
       </style>
</head>  
<body>  
 Pobliczanie P i obw prostokąta
<br> <br> 
<form name="formularz" onsubmit="drabina_ponomarenko(this.d.value,this.x.value); 
alfa_pon(this.d.value,this.drabina.value);return false">   
     Podaj d= 
        <input  size="6"  name="d"> 
     Podaj x= 
        <input  size="6"  name="x"> 
                       <br>   <br> 
         <input  TYPE="submit"  Value="oblicz" > 
                       <br>   <br> 
       P= 
           <input  size="6"  name="drabina"> 
       obw= 
          <input  size="6"  name="alfa"> 
</form> 
<table> 
              <tr id="pokaz1"></tr> 
              <tr id="pokaz2"></tr> 
</table>
</body>  
</html>
