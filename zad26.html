<html>  
<head>  
<title> 
Przykład obliczenia p i obw trapezu
</title> 
<script language="JavaScript"> 
function Pole(a,b,h) 
{ 
a_liczba=parseFloat(a) 
b_liczba=parseFloat(b) 
h_liczba=parseFloat(h) 
pole_wynik=((a_liczba+b_liczba)*h_liczba/2) 
document.getElementsByName('obj')[0].value=pole_wynik.toFixed(2);   /* na dokument  */ 
alert("Pole="+pole_wynik.toFixed(2)+" cm^2");                                                  
pokaz1.innerHTML="Pole="+pole_wynik.toFixed(2)+" cm^2 "+"<br>";        
/*do okna Alert */ 
/* do tabeli */
} 
function Obw(a,b) 
{ 
    a_liczba=parseFloat(a)
      b_liczba=parseFloat(b)
      obw_wynik=2*(a_liczba+b_liczba)
      document.getElementsByName('obw')[0].value=obw_wynik.toFixed(2);
} 
       </script> 
</head>  
<body>  
 Pobliczanie pola   i    obwodu trapezu 
<br> <br> 
<form name="formularz" onsubmit="Pole(this.a.value,this.b.value,this.h.value); 
Obw(this.a.value,this.b.value);return false">   
     Podaj a= 
        <input  size="6"  name="a"> 
     Podaj b= 
        <input  size="6"  name="b"> 
     Podaj h= 
        <input  size="6"  name="h"> 
                       <br>   <br> 
         <input  TYPE="submit"  Value="oblicz" > 
                       <br>   <br> 
       pole= 
           <input  size="6"  name="obj"> 
       obw= 
          <input  size="6"  name="obw"> 
</form> 
<table> 
              <tr id="pokaz1"></tr> 
              <tr id="pokaz2"></tr> 
</table> 
</body>  
</html>
