              var D1_pon=prompt("Data1>Data2    Data1=",""); 
              var G1_pon=prompt("Godzina1>Godzina2    Godzina1=",""); 
              var D2_pon=prompt("Data2<Data1    Data2=","");

                var d=parseFloat(G2_pon);

              document.write("Ilość sekund między dniami "+a+" i "+b+" = "+sekund_pon+" s"+"<br>");

                 { 
                   window.close() 
                 }
