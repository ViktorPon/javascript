<textarea rows="100" cols="100">
<html>  
<head>  
<title> 
Przykład obliczenia P i obwodu prostokąta 
</title> 
<script language="JavaScript"> 
function pole_ponomarenko(a,b) 
{ 
a_liczba=parseFloat(a) 
b_liczba=parseFloat(b) 
pole_wynik=a_liczba*b_liczba
document.getElementsByName('pole')[0].value=pole_wynik.toFixed(2);   /* na dokument  */ 
alert("pole="+pole_wynik.toFixed(2)+" cm^2");                                                  
pokaz1.innerHTML="P="+pole_wynik.toFixed(2)+" cm^2"+"<br>";        
/*do okna Alert */ 
/* do tabeli */
} 
function obwod_ponomarenko(a,b) 
{ 
    a_liczba=parseFloat(a) 
    b_liczba=parseFloat(b) 
   obwod_wynik=2*(a_liczba+b_liczba)
   document.getElementsByName('obwod')[0].value=obwod_wynik.toFixed(2); 
   alert("obwod="+obwod_wynik.toFixed(2)+" cm"); 
   pokaz2.innerHTML="O="+obwod_wynik.toFixed(2)+"cm"; 
} 
       </script> 
</head>  
<body>  
 Pobliczanie P i obw prostokąta
<br> <br> 
<form name="formularz" action="..." onsubmit="pole_ponomarenko(this.a.value,this.b.value); 
obwod_ponomarenko(this.a.value,this.b.value);return false">   
     Podaj a= 
        <input  size="6"  name="a"> 
     Podaj b= 
        <input  size="6"  name="b"> 
                       <br>   <br> 
         <input  TYPE="submit"  Value="oblicz" > 
                       <br>   <br> 
       P= 
           <input  size="6"  name="pole"> 
       obw= 
          <input  size="6"  name="obwod"> 
</form> 
<table> 
              <tr id="pokaz1"></tr> 
              <tr id="pokaz2"></tr> 
</table> 
</body>  
</html> 



</textarea>
