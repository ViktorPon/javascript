<html>
    <head>
        <title>proste obliczenia ponomarenko</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <div style="color: red; font-size: 50px;">
            <script language="JavaScript">
                var liczba1 = prompt("D1=","");
                var liczba2 = prompt("D2=","");
                var ile_sekund_pon;
                var D1_pon=parseFloat(liczba1);
                var D2_pon=parseFloat(liczba2);
                ile_sekund_pon = (D1_pon-D2_pon)*24*3600;
            document.write("D1="+D1_pon+"  D2="+D2_pon+"<br>");
            document.write("ile sekund="+ile_sekund_pon+"<br>");
            </script>
        </div>

    
</html>
