<!DOCTYPE html>   
<head>    
<title> zad18_ponomarenko </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_pon(a, b) { 
return a + b; 
} 
function odejmowanie_pon(a, b) { 
return a - b; 
}
function mnozenie_pon(a, b) {
return a * b;
}
function kwadrat_pon(a, b) {
return Math.pow(a, 2) 
return Math.pow(b, 2);
}
function modulo_pon(a, b) {
return a % b;
}
document.write("suma="+suma_pon(a,b)+"<br>");
document.write("różnica="+odejmowanie_pon(a,b)+"<br>"); 
document.write("iloczyn="+mnozenie_pon(a,b)+"<br>");
document.write("kwadrat a="+kwadrat_pon(a,b)+"<br>");
document.write("kwadrat b="+kwadrat_pon(b,a)+"<br>");
document.write("reszta z dzielenia="+modulo_pon(a,b)+"<br>");   
</script> 
</div> 
</body> 
</html>
