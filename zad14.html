<html>
<head>
    <title>Obliczanie wyniku</title>
    <meta charset="UTF-8">
</head>
<body>

<script language="JavaScript">
var mM = Number(prompt("Podaj wartość m:", ""));
var m = parseFloat(mM);
m1=m+2;
m2=(m+1)*(m+2);
m3=m*(m+1);
if (m > 0) {
    document.write("1/"+m+"=1/"+m1+"+ 1/"+m2+"+ 1/"+m3+"<br>");
}
else {
    document.write("Wartość m jest ujemna. Nie można obliczyć wyniku.");
}
</script>
</body>
</html>
